[project]
name = "spectra"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "essentia-tensorflow>=2.1b6.dev1438",
    "numpy>=2.5.1",
    "python-dotenv>=1.2.2",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.32.0",
    "pika>=1.3.2",
    "boto3>=1.35.0",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
# PANNs event-timeline POC (independent of Essentia).
# Install with: uv sync --extra panns
# Uses the vendored panns_support stack (torch only). Upstream
# panns-inference is optional if you want it instead.
panns = [
    "torch",
]

# Prefer CPU wheels for a lighter POC install (override if you have CUDA).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
